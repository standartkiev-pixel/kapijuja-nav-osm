name: Bootstrap MapLibre Navigation fork

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/bootstrap-maplibre-fork.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import MapLibre Navigation Android upstream snapshot
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/maplibre/maplibre-navigation-android.git /tmp/maplibre-navigation-android
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          mkdir -p .github/workflows
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} + || true
          find .github/workflows -mindepth 1 -maxdepth 1 ! -name bootstrap-maplibre-fork.yml -exec rm -rf {} + || true
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/workflows/' \
            /tmp/maplibre-navigation-android/ ./
          mkdir -p .github/upstream-workflows
          cp -a /tmp/maplibre-navigation-android/.github/workflows/. .github/upstream-workflows/

          # Upstream contains an old Mapbox access token in historical reroute fixtures.
          # Keep the fixtures, redact only imported source data, and never modify .github.
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = 0
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts:
                  continue
              try:
                  raw = path.read_bytes()
              except OSError:
                  continue
              if b'\x00' in raw or b'access_token=' not in raw:
                  continue
              try:
                  text = raw.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              clean, count = re.subn(r'access_token=[^&"\\\s]+', 'access_token=REDACTED_UPSTREAM_TOKEN', text)
              if count:
                  path.write_text(clean, encoding='utf-8')
                  changed += count
                  print(f'Redacted {count} token occurrence(s) in {path}')
          print(f'Total upstream token occurrences redacted: {changed}')
          PY

          printf '%s\n' 'f97db55505263168a116723c2ba6ab7c0d167e87' > UPSTREAM_MAPLIBRE_COMMIT
          printf '%s\n' 'https://github.com/maplibre/maplibre-navigation-android' > UPSTREAM_MAPLIBRE_REPOSITORY

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Import MapLibre Navigation Android upstream snapshot'
          git push origin HEAD:main
